<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How much my Claude</title>
  <link rel="icon" href="icon.ico">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/echarts.min.js"></script>
  <script src="i18n.js"></script>
</head>
<body>
  <!-- 左上角露出一角的标志，点击在 Claude / OpenAI 之间切换。图形取自 cc-switch 的 src/icons/extracted -->
  <div class="corner-logos" data-logo="claude" aria-hidden="true">

    <svg class="logo logo-claude" viewBox="0 0 24 24"><path fill="currentColor" d="M4.709 15.955l4.72-2.647.08-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.073-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.97 2.97 0 01-.104-.729L6.283.134 6.696 0l.996.134.42.364.62 1.414 1.002 2.229 1.555 3.03.456.898.243.832.091.255h.158V9.01l.128-1.706.237-2.095.23-2.695.08-.76.376-.91.747-.492.584.28.48.685-.067.444-.286 1.851-.559 2.903-.364 1.942h.212l.243-.242.985-1.306 1.652-2.064.73-.82.85-.904.547-.431h1.033l.76 1.129-.34 1.166-1.064 1.347-.881 1.142-1.264 1.7-.79 1.36.073.11.188-.02 2.856-.606 1.543-.28 1.841-.315.833.388.091.395-.328.807-1.969.486-2.309.462-3.439.813-.042.03.049.061 1.549.146.662.036h1.622l3.02.225.79.522.474.638-.079.485-1.215.62-1.64-.389-3.829-.91-1.312-.329h-.182v.11l1.093 1.068 2.006 1.81 2.509 2.33.127.578-.322.455-.34-.049-2.205-1.657-.851-.747-1.926-1.62h-.128v.17l.444.649 2.345 3.521.122 1.08-.17.353-.608.213-.668-.122-1.374-1.925-1.415-2.167-1.143-1.943-.14.08-.674 7.254-.316.37-.729.28-.607-.461-.322-.747.322-1.476.389-1.924.315-1.53.286-1.9.17-.632-.012-.042-.14.018-1.434 1.967-2.18 2.945-1.726 1.845-.414.164-.717-.37.067-.662.401-.589 2.388-3.036 1.44-1.882.93-1.086-.006-.158h-.055L4.132 18.56l-1.13.146-.487-.456.061-.746.231-.243 1.908-1.312-.006.006z"/></svg>
  </div>
  <button id="logo-toggle" class="logo-toggle" type="button" data-i18n-aria="切换左上角标志" data-i18n-title="点击切换 Claude / OpenAI"></button>
  <header class="topbar">
    <h1 class="sr-only">How much my Claude</h1>
    <div class="actions">
      <span id="sync-info" class="muted"></span>
      <button id="btn-sync" type="button" data-i18n="立即同步">立即同步</button>
    </div>
  </header>

  <main>
    <div id="connect"></div>
    <div id="alert-banner"></div>

    <section>
      <h2 data-k="01"><span data-i18n="现在">现在</span>
        <span class="info" tabindex="0" data-i18n-tip="每格 2%。实心格是已经用掉的；斜纹格是照目前的速度、到重置时还会用掉的（变红说明会提前用完）；上方的小三角是窗口时间走到哪了。实心格跑在小三角前面，就是用得比时间快。">?</span>
      </h2>
      <div id="now" class="grid-2"></div>
    </section>

    <section>
      <h2 data-k="02"><span data-i18n="额度有没有被调">额度有没有被调</span>
        <span class="info" tabindex="0" data-i18n-tip="每个窗口都折算成「全用主力模型时值多少钱」，消除模型组合的影响。偏离仪的指针是最近几个窗口比之前变了多少，中间绿色一段是正常波动范围，落到左边红区是收紧、右边黄区是放宽。下面小图里的灰带也是这个范围；最近的窗口偏出灰带才判为变化。空心点是不满足估值条件（采集不完整、覆盖待确认等）或用量太少的窗口，不参与判断。竖线是规则变化（提前重置、方案变化、接口字段变化）。点一个点可以看那个窗口的详情。">?</span>
      </h2>
      <div id="monitor" class="grid-2"></div>
      <div id="detail" class="panel" hidden>
        <div class="panel-head">
          <h3 id="detail-title"></h3>
          <span id="detail-note" class="muted"></span>
          <button id="detail-exclude" type="button" class="mini"></button>
        </div>
        <div id="detail-quality" class="detail-quality"></div>
        <div id="detail-chart" class="chart"></div>
      </div>
    </section>

    <section>
      <h2 data-k="03"><span data-i18n="单用一个模型时，一个窗口值多少钱">单用一个模型时，一个窗口值多少钱</span>
        <span class="info" tabindex="0" data-i18n-tip="额度消耗和 API 价格不成正比：同样花 $1，便宜模型往往吃掉更多额度。这是用近 60 天干净窗口回归出的汇率。浅色条表示该模型出现的窗口少，估计不稳。">?</span>
      </h2>
      <div id="rates" class="grid-2"></div>
    </section>

    <section>
      <div class="section-head">
        <h2 data-k="04"><span data-i18n="用量">用量</span></h2>
        <div class="filters">
          <div class="seg" id="f-range">
            <button data-v="today" type="button" data-i18n="今天">今天</button>
            <button data-v="7d" type="button" class="on" data-i18n="近 7 天">近 7 天</button>
            <button data-v="30d" type="button" data-i18n="近 30 天">近 30 天</button>
          </div>
          <div class="seg" id="f-tool">
            <button data-v="all" type="button" class="on" data-i18n="全部">全部</button>
            <button data-v="codex" type="button">Codex</button>
            <button data-v="claude" type="button">Claude</button>
          </div>
        </div>
      </div>
      <div id="usage-tiles" class="tiles"></div>
      <div class="grid-usage">
        <div class="panel">
          <h3 id="cost-chart-title"></h3>
          <div id="cost-chart" class="chart"></div>
        </div>
        <div class="panel">
          <h3 data-i18n="花在哪些模型上">花在哪些模型上</h3>
          <div id="model-chart" class="chart"></div>
          <p id="model-note" class="muted small"></p>
        </div>
      </div>
    </section>

    <section class="more">
      <details id="data-details">
        <summary><span data-i18n="数据管理">数据管理</span> <span class="muted" data-i18n="（存了什么、要不要留）">（存了什么、要不要留）</span></summary>
        <div id="data-panel" class="panel"></div>
      </details>
      <details>
        <summary><span data-i18n="模型价格">模型价格</span> <span id="price-count" class="muted"></span></summary>
        <div class="panel">
          <div class="price-tools">
            <div class="seg" id="f-price">
              <button data-v="used" type="button" class="on" data-i18n="我用过的">我用过的</button>
              <button data-v="all" type="button" data-i18n="全部">全部</button>
            </div>
            <input id="price-search" type="search" data-i18n-placeholder="搜模型名" data-i18n-aria="搜模型名">
          </div>
          <div class="table-wrap"><table id="price-table"></table></div>
          <p id="price-note" class="muted small"></p>
        </div>
      </details>
      <details>
        <summary><span data-i18n="规则变化记录">规则变化记录</span> <span id="events-count" class="muted"></span></summary>
        <div id="events" class="panel"></div>
      </details>
      <details id="history-details">
        <summary data-i18n="窗口历史">窗口历史</summary>
        <div class="panel">
          <div class="seg" id="f-history">
            <button data-v="codex" type="button" class="on">Codex</button>
            <button data-v="claude" type="button">Claude</button>
          </div>
          <div class="table-wrap"><table id="window-table"></table></div>
        </div>
      </details>
      <details>
        <summary data-i18n="按模型明细">按模型明细</summary>
        <div class="panel"><div class="table-wrap"><table id="model-table"></table></div></div>
      </details>
      <details>
        <summary data-i18n="设置">设置</summary>
        <div id="settings-panel" class="panel"></div>
      </details>
      <details>
        <summary data-i18n="运行状态">运行状态</summary>
        <div id="status" class="panel status"></div>
      </details>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
